name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Trusted publishing requires npm >= 11.5.1 (Node 20 ships npm 10)
      - run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: npm authenticates via GitHub OIDC trusted publishing
      - run: npm publish
